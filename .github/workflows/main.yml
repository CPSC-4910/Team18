name: Deploy to EC2

on:
  push:
    branches:
      - dashboard-feature-updates

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # Consider updating to v4 if needed

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Ensure scripts are executable
        run: |
          chmod +x scripts/*.sh
      - name: Create deployment package
        run: |
          ls -R
          zip -r deployment.zip . -x "*.git*" "node_modules/*" "*/node_modules/*"
      - name: Verify archive contents
        run: |
          unzip -l deployment.zip | grep scripts/
      - name: Upload to S3
        run: |
          aws s3 cp deployment.zip s3://${{ secrets.S3_BUCKET }}/deployment-${{ github.sha }}.zip

      - name: Create CodeDeploy deployment
        run: |
          aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APP_NAME }} \
            --deployment-group-name ${{ secrets.CODEDEPLOY_GROUP_NAME }} \
            --s3-location bucket=${{ secrets.S3_BUCKET }},key=deployment-${{ github.sha }}.zip,bundleType=zip \
            --description "Deployment from GitHub commit ${{ github.sha }}"
      # --- END OF REQUIRED STEPS ---
