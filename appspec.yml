version: 0.0
os: linux
files:
  - source: /
    destination: /home/ec2-user/app
    overwrite: true
permissions:
  - object: /home/ec2-user/app/App/backend
    owner: ec2-user
    group: ec2-user
    mode: 755 # Read/Write/Execute for owner, Read/Execute for others
    type:
      - directory
      - file
  - object: /home/ec2-user/app/App/frontend
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - directory
      - file
hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: ec2-user
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 300
      runas: ec2-user
  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 300
      runas: ec2-user
  ApplicationStop:
  - location: scripts/application_stop.sh
    timeout: 300
    runas: ec2-user
    optional: true
